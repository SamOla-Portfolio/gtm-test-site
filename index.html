    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Headphones - Checkout</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; }
        .container { width: 80%; max-width: 800px; margin: 40px auto; overflow: hidden; padding: 30px; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.05); border-radius: 8px; }
        .product-image { width: 100%; height: 350px; background-color: #e9ecef; text-align: center; line-height: 350px; color: #6c757d; font-size: 24px; margin-bottom: 20px; border-radius: 4px; }
        

        /* الزر المستهدف لتتبع التردد */
        #checkout-btn { padding: 15px 40px; font-size: 18px; font-weight: bold; color: white; background-color: #0d6efd; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.2s; }
        #checkout-btn:hover { background-color: #0b5ed7; }
        
        /* رسالة النجاح المخفية افتراضياً */
        #success-message { display: none; margin-top: 20px; padding: 20px; background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; border-radius: 5px; font-size: 18px; font-weight: bold; }
    </style>

<body>
     <!-- Google Tag Manager (noscript) -->

<!-- End Google Tag Manager (noscript) -->
    <div class="container">
        <h1>Premium Wireless Headphones (Test Product)</h1>
        <div class="product-image">[ Product Image Placeholder ]</div>
        <p>Welcome to our store. Please scroll down to review the product details and complete your secure checkout.</p>

        <div class="spacer">
            <h2>Product Details & Specifications</h2>
            </div>

        <div class="checkout-section">
            <h2>Ready to Complete Your Order?</h2>
            <button id="checkout-btn">Complete Purchase</button>
            
            <div id="success-message">Payment Successful! Thank you for your order.</div>
        </div>
    </div>

    <script>
        // سكربت بسيط لإخفاء الزر وإظهار رسالة النجاح عند النقر
        document.getElementById('checkout-btn').addEventListener('click', function() {
            this.style.display = 'none'; 
            document.getElementById('success-message').style.display = 'block'; 
        });
    </script>
